<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFU World Editor</title>
<style>
:root {
    --bg: #15171c; --panel: #1d2027; --panel2: #252933; --line: #343947; --text: #e4e7ee; --dim: #9aa1b2;
    --accent: #5aa9ff; --warn: #ffb347; --bad: #ff6b6b; --good: #6bd88f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
#app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
#side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#side header { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
#side h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .02em; }
#scroll { overflow-y: auto; flex: 1; padding: 8px 12px 16px; }
section { margin-bottom: 12px; }
section > h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 8px 0 6px; font-weight: 600; }
select, input, textarea, button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; }
select, input[type=text], input[type=number], textarea { width: 100%; padding: 4px 6px; }
textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; min-height: 120px; resize: vertical; }
button { padding: 5px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: #24456b; border-color: var(--accent); }
button.danger:hover { border-color: var(--bad); }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
#toolOptions .btns button { padding: 3px 7px; font-size: 12px; }
.tools button { padding: 6px 4px; font-size: 12px; }
.tools button kbd { color: var(--dim); font-size: 10px; margin-left: 3px; }
.row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
.row > label { flex: 0 0 92px; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row > input, .row > select { flex: 1; min-width: 0; }
.checks label { display: inline-flex; gap: 4px; align-items: center; margin: 2px 10px 2px 0; color: var(--dim); }
.hint { color: var(--dim); font-size: 12px; margin: 4px 0; }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.good { color: var(--good); }
.box { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
footer .btns { display: grid; grid-template-columns: 1fr 1fr; }
#main { position: relative; min-width: 0; }
#gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; }
#ov { cursor: crosshair; }
#status { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 10px; background: rgba(13,15,19,.85); color: var(--dim); font-size: 12px; pointer-events: none; white-space: nowrap; overflow: hidden; }
#toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #23324a; border: 1px solid var(--accent); padding: 6px 12px; border-radius: 6px; display: none; z-index: 5; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 15px; }
footer { border-top: 1px solid var(--line); padding: 8px 12px; }
.layers { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.layers label { display: inline-flex; gap: 4px; align-items: center; color: var(--text); }
.layers label.all { flex-basis: 100%; color: var(--accent); font-weight: 600; }
#palette { display: none; }
#palette input[type=text] { margin-bottom: 4px; }
#palette h3, .feature h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 10px 0 4px; font-weight: 600; }
.pal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.palItem { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px; cursor: pointer; text-align: center; font-size: 10px; color: var(--dim); overflow: hidden; }
.palItem:hover { border-color: var(--accent); }
.palItem.on { border-color: var(--accent); background: #24456b; color: var(--text); }
.palItem img { width: 100%; aspect-ratio: 1; object-fit: contain; image-rendering: pixelated; display: block; }
.palItem i.swatch { display: block; width: 100%; aspect-ratio: 1; border-radius: 3px; opacity: .6; }
.palItem span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feature { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 2px; }
details summary { cursor: pointer; color: var(--dim); margin: 6px 0 2px; }
#legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; font-size: 11px; color: var(--dim); }
#legend i { width: 10px; height: 10px; display: inline-block; border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>Escape from Unova · World Editor</h1>
      <select id="mapSelect" title="Map"></select>
    </header>
    <div id="scroll">
      <section>
        <h2>Tools</h2>
        <div class="tools" id="tools"></div>
        <div id="toolOptions" class="hint"></div>
        <div id="palette"></div>
      </section>
      <section>
        <h2>Layers the tools change</h2>
        <div id="layers" class="layers"></div>
      </section>
      <section>
        <h2>View</h2>
        <div class="row"><label>Overlay</label>
          <select id="overlay">
            <option value="collision">Collision</option>
            <option value="class">Tile classes</option>
            <option value="none">None</option>
          </select></div>
        <div class="checks">
          <label><input type="checkbox" id="showEvents" checked> Events</label>
          <label><input type="checkbox" id="showProps" checked> Props</label>
          <label><input type="checkbox" id="showGrid" checked> Grid</label>
          <label><input type="checkbox" id="show3d"> 3D</label>
          <label><input type="checkbox" id="showFest"> Festival spots</label>
          <label><input type="checkbox" id="snapHeight" checked> Heights follow ground</label>
        </div>
        <div id="legend"></div>
      </section>
      <section>
        <h2>Inspector</h2>
        <div id="inspector" class="box"><div class="hint">Click a tile, an event, a prop or (Chunk tool) a chunk.</div></div>
      </section>
      <section>
        <h2>Changes</h2>
        <div id="changes" class="hint"></div>
      </section>
    </div>
    <footer>
      <div class="btns">
        <button id="saveBtn" title="Ctrl+S">Save edits</button>
        <button id="openBtn">Open…</button>
        <button id="undoBtn" title="Ctrl+Z">Undo</button>
        <button id="redoBtn" title="Ctrl+Y">Redo</button>
      </div>
      <input type="file" id="openFile" accept=".json" hidden>
    </footer>
  </aside>
  <main id="main">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="status"></div>
    <div id="toast"></div>
    <div id="loading">Loading the world…</div>
  </main>
</div>
<script src="editor.js"></script>
</body>
</html>
